name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Vercel CLI reads these from the environment. Values come from Actions secrets.
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fork pull requests cannot read repository secrets. Typecheck still runs
    # in "Typecheck and build" (.github/workflows/ci.yml).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: "AI Job Alchemist"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Repo .nvmrc is 18 (EOL). Keep Node 20 for the Vercel CLI and for
          # `vercel build`, matching the runtime used before this workflow
          # failed on a missing token. Action runtime is Node 24 (checkout v7
          # and setup-node v7); that is not the version used to build the app.
          node-version: 20
          cache: npm
          cache-dependency-path: "AI Job Alchemist/package-lock.json"

      - name: Confirm app directory
        run: |
          test -f package.json
          test -f vercel.json
          echo "Deploying from $(pwd)"

      - name: Check Vercel credentials
        id: vercel_creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=()
          [ -z "${VERCEL_TOKEN}" ] && missing+=("VERCEL_TOKEN")
          [ -z "${VERCEL_ORG_ID}" ] && missing+=("VERCEL_ORG_ID")
          [ -z "${VERCEL_PROJECT_ID}" ] && missing+=("VERCEL_PROJECT_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing GitHub Actions secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions:"
            echo "  VERCEL_TOKEN       from https://vercel.com/account/tokens"
            echo "  VERCEL_ORG_ID      from .vercel/project.json (orgId)"
            echo "  VERCEL_PROJECT_ID  from .vercel/project.json (projectId)"
            echo "See AI Job Alchemist/DEPLOYMENT.md"
            # PRs / workflow_dispatch without secrets: skip deploy (do not fail CI).
            # Push to main still fails so production misconfig is visible.
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "::notice title=Skipping Vercel deploy::Missing secrets (${missing[*]}). Configure repository Actions secrets to enable preview deploys. Typecheck still runs in the Typecheck and build workflow."
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "::error title=Missing Vercel GitHub Actions secrets::Set these repository secrets before Deploy to Vercel can succeed: ${missing[*]}. See AI Job Alchemist/DEPLOYMENT.md. Typecheck does not need them and runs in the Typecheck and build workflow."
            echo "Do not commit these values. Pull requests from forks never receive them."
            exit 1
          fi
          echo "skip=false" >> "${GITHUB_OUTPUT}"

      - name: Install Vercel CLI
        if: steps.vercel_creds.outputs.skip != 'true'
        run: npm install --global vercel@latest

      - name: Install app dependencies
        if: steps.vercel_creds.outputs.skip != 'true'
        run: npm ci --legacy-peer-deps

      - name: Pull Vercel environment
        if: steps.vercel_creds.outputs.skip != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            environment=production
          else
            environment=preview
          fi
          vercel pull --yes --environment="${environment}" --token="${VERCEL_TOKEN}"

      - name: Build project artifacts
        if: steps.vercel_creds.outputs.skip != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Keep devDependencies (vite/tsc) available for local `vercel build`.
          NPM_CONFIG_PRODUCTION: "false"
        run: |
          # Project dashboard settings may use bare `vite build`; ensure bins resolve.
          export PATH="${PWD}/node_modules/.bin:${PATH}"
          test -x node_modules/.bin/vite
          # Prefer package.json build script (adds node_modules/.bin via npm).
          if [ -f .vercel/project.json ]; then
            node -e '
              const fs = require("fs");
              const p = ".vercel/project.json";
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              j.settings = j.settings || {};
              j.settings.buildCommand = "npm run build";
              j.settings.installCommand = "npm ci --legacy-peer-deps";
              fs.writeFileSync(p, JSON.stringify(j, null, 2));
              console.log("Forced buildCommand:", j.settings.buildCommand);
            '
          fi
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            vercel build --prod --token="${VERCEL_TOKEN}"
          else
            vercel build --token="${VERCEL_TOKEN}"
          fi

      - name: Deploy project artifacts to Vercel
        if: steps.vercel_creds.outputs.skip != 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            url=$(vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}")
          else
            url=$(vercel deploy --prebuilt --token="${VERCEL_TOKEN}")
          fi
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "Deployed to: ${url}"
          echo "::notice title=Deployment URL::${url}"
